<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OpenClaw Workroom</title>
  <style>
    :root{
      --bg:#0b1118;
      --bg2:#111b27;
      --line:#244258;
      --txt:#e7f0f7;
      --muted:#8ba5bb;
      --ok:#22c55e;
      --warn:#f59e0b;
      --bad:#ef4444;
      --accent:#38bdf8;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      color:var(--txt);
      background:
        radial-gradient(900px 500px at 10% 0%, rgba(56,189,248,.14), transparent 60%),
        radial-gradient(900px 500px at 90% -10%, rgba(34,197,94,.08), transparent 60%),
        var(--bg);
    }
    .top{
      display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;
      border-bottom:1px solid var(--line);padding:12px 16px;background:rgba(11,17,24,.92);position:sticky;top:0;z-index:2
    }
    .title{font-size:18px;font-weight:800}
    .sub{font-size:12px;color:var(--muted)}
    .actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .btn,.chip{
      background:var(--bg2);border:1px solid var(--line);color:var(--txt);border-radius:8px;
      padding:6px 10px;text-decoration:none;font-size:12px;font-weight:700
    }
    .btn.primary{background:rgba(56,189,248,.2);border-color:rgba(56,189,248,.45)}
    main{padding:16px;display:grid;gap:14px}
    .summary{
      display:grid;grid-template-columns:repeat(4,minmax(180px,1fr));gap:10px
    }
    .kpi{border:1px solid var(--line);background:var(--bg2);border-radius:10px;padding:10px}
    .kpi .k{font-size:11px;color:var(--muted)}
    .kpi .v{font-size:18px;font-weight:800}
    .v.ok{color:var(--ok)} .v.warn{color:var(--warn)} .v.bad{color:var(--bad)}
    .room{
      border:1px solid var(--line);border-radius:14px;padding:14px;background:linear-gradient(180deg, rgba(17,27,39,.9), rgba(11,17,24,.9));
      display:grid;grid-template-columns:repeat(2,minmax(280px,1fr));gap:12px
    }
    .desk{
      border:1px solid var(--line);border-radius:12px;background:#0d1520;padding:10px;position:relative;overflow:hidden
    }
    .desk::after{
      content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent,rgba(255,255,255,.04),transparent);
      transform:translateX(-100%);animation:sweep 4s linear infinite
    }
    @keyframes sweep{to{transform:translateX(100%)}}
    .desk-head{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:8px;position:relative;z-index:1}
    .desk-title{font-size:13px;font-weight:800}
    .desk-state{font-size:11px;font-weight:800;border-radius:999px;padding:2px 8px;border:1px solid var(--line)}
    .state-ok{color:var(--ok);background:rgba(34,197,94,.18)}
    .state-warn{color:var(--warn);background:rgba(245,158,11,.18)}
    .state-bad{color:var(--bad);background:rgba(239,68,68,.18)}
    .monitor{
      border:1px solid var(--line);border-radius:10px;background:#050b12;position:relative;height:110px;overflow:hidden
    }
    .scan{
      position:absolute;left:0;right:0;height:16px;background:linear-gradient(180deg, rgba(56,189,248,.0), rgba(56,189,248,.18), rgba(56,189,248,.0));
      animation:scan 2.2s linear infinite
    }
    @keyframes scan{from{top:-20px}to{top:120px}}
    .screen{
      position:absolute;inset:0;padding:10px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;color:#9be7ff;line-height:1.4
    }
    .typing::after{
      content:"";display:inline-block;width:7px;height:12px;background:#9be7ff;margin-left:5px;animation:blink 1s steps(2,end) infinite;vertical-align:-2px
    }
    @keyframes blink{50%{opacity:0}}
    .task{margin-top:8px;font-size:12px;color:var(--muted);min-height:18px;position:relative;z-index:1}
    .last{font-size:11px;color:var(--muted);margin-top:2px}
    @media(max-width:1000px){.summary{grid-template-columns:repeat(2,minmax(180px,1fr))}.room{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header class="top">
    <div>
      <div class="title" id="title">Sala de trabajo OpenClaw</div>
      <div class="sub" id="subtitle">Visual de tareas activas por proyecto y domótica</div>
    </div>
    <div class="actions">
      <select id="langSelect" class="chip">
        <option value="es">ES</option>
        <option value="en">EN</option>
      </select>
      <button id="refreshBtn" class="btn primary">↻ Actualizar</button>
      <a class="btn" href="/">← Dashboard</a>
    </div>
  </header>

  <main>
    <section class="summary" id="summary"></section>

    <section class="room">
      <article class="desk" id="desk-vocari">
        <div class="desk-head">
          <div class="desk-title">vocari.cl</div>
          <div class="desk-state state-warn" data-state>...</div>
        </div>
        <div class="monitor">
          <div class="scan"></div>
          <div class="screen typing" data-screen></div>
        </div>
        <div class="task" data-task></div>
        <div class="last" data-last></div>
      </article>

      <article class="desk" id="desk-humanloop">
        <div class="desk-head">
          <div class="desk-title">humanloop.cl</div>
          <div class="desk-state state-warn" data-state>...</div>
        </div>
        <div class="monitor">
          <div class="scan"></div>
          <div class="screen typing" data-screen></div>
        </div>
        <div class="task" data-task></div>
        <div class="last" data-last></div>
      </article>

      <article class="desk" id="desk-blog">
        <div class="desk-head">
          <div class="desk-title">jaimehernandez.dev</div>
          <div class="desk-state state-warn" data-state>...</div>
        </div>
        <div class="monitor">
          <div class="scan"></div>
          <div class="screen typing" data-screen></div>
        </div>
        <div class="task" data-task></div>
        <div class="last" data-last></div>
      </article>

      <article class="desk" id="desk-ha">
        <div class="desk-head">
          <div class="desk-title">Home Assistant</div>
          <div class="desk-state state-warn" data-state>...</div>
        </div>
        <div class="monitor">
          <div class="scan"></div>
          <div class="screen typing" data-screen></div>
        </div>
        <div class="task" data-task></div>
        <div class="last" data-last></div>
      </article>
    </section>
  </main>

  <script src="/workroom.js"></script>
</body>
</html>
