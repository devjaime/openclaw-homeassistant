<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OpenClaw Workroom</title>
  <style>
    :root{
      --bg:#0b1118;
      --bg2:#111b27;
      --line:#244258;
      --txt:#e7f0f7;
      --muted:#8ba5bb;
      --ok:#22c55e;
      --warn:#f59e0b;
      --bad:#ef4444;
      --accent:#38bdf8;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      color:var(--txt);
      background:
        radial-gradient(900px 500px at 10% 0%, rgba(56,189,248,.14), transparent 60%),
        radial-gradient(900px 500px at 90% -10%, rgba(34,197,94,.08), transparent 60%),
        var(--bg);
      min-height:100vh;
    }
    .top{
      display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;
      border-bottom:1px solid var(--line);padding:12px 16px;
      background:rgba(11,17,24,.92);position:sticky;top:0;z-index:10
    }
    .title{font-size:18px;font-weight:800}
    .sub{font-size:12px;color:var(--muted)}
    .actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .btn,.chip{
      background:var(--bg2);border:1px solid var(--line);color:var(--txt);border-radius:8px;
      padding:6px 10px;text-decoration:none;font-size:12px;font-weight:700;cursor:pointer
    }
    .btn.primary{background:rgba(56,189,248,.2);border-color:rgba(56,189,248,.45)}

    /* ── Summary KPIs ── */
    main{padding:16px;display:grid;gap:14px}
    .summary{display:grid;grid-template-columns:repeat(4,minmax(180px,1fr));gap:10px}
    .kpi{border:1px solid var(--line);background:var(--bg2);border-radius:10px;padding:10px}
    .kpi .k{font-size:11px;color:var(--muted)}
    .kpi .v{font-size:18px;font-weight:800}
    .v.ok{color:var(--ok)} .v.warn{color:var(--warn)} .v.bad{color:var(--bad)}

    /* ── Room grid ── */
    .room{
      display:grid;grid-template-columns:repeat(2,minmax(320px,1fr));gap:14px
    }

    /* ── Desk (agent panel) ── */
    .desk{
      border:1px solid var(--line);border-radius:14px;
      background:linear-gradient(180deg, rgba(17,27,39,.95), rgba(11,17,24,.95));
      padding:12px;display:flex;flex-direction:column;gap:8px;min-height:460px
    }
    .desk-head{
      display:flex;align-items:center;gap:8px;flex-shrink:0
    }
    .desk-title{font-size:13px;font-weight:800;flex:1}
    .desk-state{
      font-size:11px;font-weight:800;border-radius:999px;
      padding:2px 8px;border:1px solid var(--line);white-space:nowrap
    }
    .state-ok{color:var(--ok);background:rgba(34,197,94,.18)}
    .state-warn{color:var(--warn);background:rgba(245,158,11,.18)}
    .state-bad{color:var(--bad);background:rgba(239,68,68,.18)}
    .desk-clear{
      background:transparent;border:1px solid var(--line);color:var(--muted);
      border-radius:6px;padding:2px 7px;font-size:11px;cursor:pointer;flex-shrink:0
    }
    .desk-clear:hover{background:rgba(255,255,255,.07);color:var(--txt)}

    /* ── Status strip ── */
    .status-strip{
      font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
      font-size:10px;color:#9be7ff;background:#050b12;
      border:1px solid var(--line);border-radius:8px;
      padding:6px 10px;line-height:1.5;flex-shrink:0;
      white-space:pre
    }

    /* ── Chat messages ── */
    .chat{
      flex:1;overflow-y:auto;padding:8px;
      border:1px solid var(--line);border-radius:10px;
      background:#050b12;
      display:flex;flex-direction:column;gap:6px;
      min-height:0
    }
    .chat-empty{
      color:var(--muted);font-size:11px;font-style:italic;
      margin:auto;text-align:center;line-height:1.8
    }
    .chat-msg{
      padding:7px 10px;border-radius:10px;
      font-size:12px;line-height:1.55;
      white-space:pre-wrap;word-break:break-word;
      max-width:90%;
    }
    .chat-msg.user{
      background:rgba(56,189,248,.15);color:#bae6fd;
      align-self:flex-end;
      border:1px solid rgba(56,189,248,.25);
      font-family:ui-sans-serif,system-ui,sans-serif
    }
    .chat-msg.agent{
      background:rgba(34,197,94,.08);color:#86efac;
      align-self:flex-start;
      border:1px solid rgba(34,197,94,.18);
      font-family:ui-monospace,SFMono-Regular,Menlo,monospace
    }
    .chat-msg.error{
      background:rgba(239,68,68,.1);color:#fca5a5;
      align-self:flex-start;
      border:1px solid rgba(239,68,68,.2);
      font-family:ui-monospace,SFMono-Regular,Menlo,monospace
    }
    .chat-ts{font-size:9px;opacity:.5;margin-top:2px;text-align:right}
    .chat-thinking{
      color:var(--muted);font-size:11px;font-style:italic;
      align-self:flex-start;padding:4px 8px
    }
    .chat-thinking::after{
      content:"...";animation:ellipsis 1.4s steps(4,end) infinite
    }
    @keyframes ellipsis{
      0%,100%{content:""}
      25%{content:"."}
      50%{content:".."}
      75%{content:"..."}
    }

    /* ── Input row ── */
    .chat-input-row{
      display:flex;gap:6px;align-items:flex-end;flex-shrink:0
    }
    .chat-input{
      flex:1;background:#050b12;border:1px solid var(--line);
      border-radius:10px;color:var(--txt);padding:8px 10px;
      font-size:12px;resize:none;
      font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
      line-height:1.4;
    }
    .chat-input::placeholder{color:var(--muted)}
    .chat-input:focus{outline:none;border-color:rgba(56,189,248,.5)}
    .chat-input:disabled{opacity:.4}
    .send-btn{
      background:rgba(56,189,248,.2);border:1px solid rgba(56,189,248,.4);
      color:var(--txt);border-radius:10px;
      width:36px;height:36px;font-size:17px;
      cursor:pointer;flex-shrink:0;
      display:flex;align-items:center;justify-content:center
    }
    .send-btn:hover:not(:disabled){background:rgba(56,189,248,.35)}
    .send-btn:disabled{opacity:.35;cursor:not-allowed}

    .last{font-size:10px;color:var(--muted);flex-shrink:0}

    /* ── Markdown rendering inside agent bubbles ── */
    .chat-msg.agent{font-family:ui-sans-serif,system-ui,sans-serif}
    .md-h{font-size:13px;font-weight:800;color:#a5f3fc;margin:6px 0 3px}
    .md-h:is(h3,h4){font-size:12px;color:#7dd3fc}
    .md-p{margin:1px 0}
    .md-li{padding-left:12px;position:relative}
    .md-li::before{content:"•";position:absolute;left:0;color:var(--accent)}
    .md-hr{border:none;border-top:1px solid var(--line);margin:6px 0}
    .md-code{
      background:#0a1929;border:1px solid var(--line);border-radius:8px;
      padding:8px 10px;margin:4px 0;overflow-x:auto;
      font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;
      color:#a5f3fc;white-space:pre;line-height:1.5
    }
    .md-inline{
      background:rgba(56,189,248,.12);border:1px solid rgba(56,189,248,.2);
      border-radius:4px;padding:1px 5px;font-size:11px;
      font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:#bae6fd
    }
    .md-table{border-collapse:collapse;width:100%;margin:6px 0;font-size:11px}
    .md-table th,.md-table td{
      border:1px solid var(--line);padding:4px 8px;text-align:left
    }
    .md-table th{background:rgba(56,189,248,.1);color:#bae6fd;font-weight:700}
    .md-table tr:nth-child(even) td{background:rgba(255,255,255,.02)}
    br{display:block;margin:2px 0}

    @media(max-width:1060px){
      .summary{grid-template-columns:repeat(2,minmax(180px,1fr))}
      .room{grid-template-columns:1fr}
    }
  </style>
</head>
<body>
  <header class="top">
    <div>
      <div class="title" id="title">Sala de trabajo OpenClaw</div>
      <div class="sub" id="subtitle">Agentes de software en paralelo por proyecto</div>
    </div>
    <div class="actions">
      <select id="langSelect" class="chip">
        <option value="es">ES</option>
        <option value="en">EN</option>
      </select>
      <button id="refreshBtn" class="btn primary">↻ Actualizar</button>
      <a class="btn" href="/">← Dashboard</a>
    </div>
  </header>

  <main>
    <section class="summary" id="summary"></section>

    <section class="room">

      <article class="desk" id="desk-vocari">
        <div class="desk-head">
          <div class="desk-title">vocari.cl</div>
          <div class="desk-state state-warn" data-state>...</div>
          <button class="desk-clear" data-clear="vocari" title="Nueva sesión">↺</button>
        </div>
        <div class="status-strip" data-screen>cargando...</div>
        <div class="chat" data-chat="vocari"></div>
        <div class="chat-input-row">
          <textarea class="chat-input" data-input="vocari" rows="2"
            placeholder="Mensaje al agente vocari.cl… (Ctrl+Enter)"></textarea>
          <button class="send-btn" data-send="vocari" title="Enviar">↑</button>
        </div>
        <div class="last" data-last></div>
      </article>

      <article class="desk" id="desk-humanloop">
        <div class="desk-head">
          <div class="desk-title">humanloop.cl</div>
          <div class="desk-state state-warn" data-state>...</div>
          <button class="desk-clear" data-clear="humanloop" title="Nueva sesión">↺</button>
        </div>
        <div class="status-strip" data-screen>cargando...</div>
        <div class="chat" data-chat="humanloop"></div>
        <div class="chat-input-row">
          <textarea class="chat-input" data-input="humanloop" rows="2"
            placeholder="Mensaje al agente humanloop.cl… (Ctrl+Enter)"></textarea>
          <button class="send-btn" data-send="humanloop" title="Enviar">↑</button>
        </div>
        <div class="last" data-last></div>
      </article>

      <article class="desk" id="desk-blog">
        <div class="desk-head">
          <div class="desk-title">jaimehernandez.dev</div>
          <div class="desk-state state-warn" data-state>...</div>
          <button class="desk-clear" data-clear="blog" title="Nueva sesión">↺</button>
        </div>
        <div class="status-strip" data-screen>cargando...</div>
        <div class="chat" data-chat="blog"></div>
        <div class="chat-input-row">
          <textarea class="chat-input" data-input="blog" rows="2"
            placeholder="Mensaje al agente jaimehernandez.dev… (Ctrl+Enter)"></textarea>
          <button class="send-btn" data-send="blog" title="Enviar">↑</button>
        </div>
        <div class="last" data-last></div>
      </article>

      <article class="desk" id="desk-ha">
        <div class="desk-head">
          <div class="desk-title">Home Assistant</div>
          <div class="desk-state state-warn" data-state>...</div>
          <button class="desk-clear" data-clear="ha" title="Nueva sesión">↺</button>
        </div>
        <div class="status-strip" data-screen>cargando...</div>
        <div class="chat" data-chat="ha"></div>
        <div class="chat-input-row">
          <textarea class="chat-input" data-input="ha" rows="2"
            placeholder="Mensaje al agente Home Assistant… (Ctrl+Enter)"></textarea>
          <button class="send-btn" data-send="ha" title="Enviar">↑</button>
        </div>
        <div class="last" data-last></div>
      </article>

    </section>
  </main>

  <script src="/workroom.js"></script>
</body>
</html>
